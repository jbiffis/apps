# BookLog PWA: serve static files, fallback to index.html for client routes
<Directory "/var/www/html/book-log">
    FallbackResource /book-log/index.html
</Directory>

# Long cache for hashed build assets
<LocationMatch "^/book-log/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Service worker must not be cached by proxies/browsers (lives at scope root)
<LocationMatch "^/book-log/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$">
    Header set Cache-Control "no-cache"
</LocationMatch>
