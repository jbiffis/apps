<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#FBF3E4"/>
  <!-- Back book (teal) -->
  <rect x="8" y="18" width="14" height="34" rx="2" fill="#3E8C84" stroke="#3B2A1E" stroke-width="2"/>
  <rect x="8" y="22" width="14" height="1.5" fill="#3B2A1E"/>
  <rect x="8" y="46" width="14" height="1.5" fill="#3B2A1E"/>
  <!-- Middle book (mustard) -->
  <g transform="rotate(-3 29 34)">
    <rect x="22" y="14" width="14" height="38" rx="2" fill="#E8A93C" stroke="#3B2A1E" stroke-width="2"/>
    <rect x="22" y="18" width="14" height="1.5" fill="#3B2A1E"/>
    <rect x="22" y="48" width="14" height="1.5" fill="#3B2A1E"/>
  </g>
  <!-- Front book (terracotta) tilted -->
  <g transform="rotate(6 48 34)">
    <rect x="40" y="16" width="14" height="38" rx="2" fill="#D9613A" stroke="#3B2A1E" stroke-width="2"/>
    <rect x="40" y="20" width="14" height="1.5" fill="#3B2A1E"/>
    <rect x="40" y="48" width="14" height="1.5" fill="#3B2A1E"/>
  </g>
  <!-- Yellow tape -->
  <rect x="18" y="8" width="16" height="5" rx="1" fill="#F6D56B" stroke="#3B2A1E" stroke-width="1" transform="rotate(-6 26 10.5)"/>
  <!-- Sparkle -->
  <g stroke="#3B2A1E" stroke-width="1.5" stroke-linecap="round">
    <path d="M 50 10 l 0 -4 M 50 10 l 0 4 M 50 10 l -4 0 M 50 10 l 4 0"/>
  </g>
</svg>
