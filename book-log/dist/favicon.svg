<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#7c3aed"/>
  <!-- Back book (green) -->
  <rect x="10" y="18" width="16" height="34" rx="2" fill="#34d399" stroke="#065f46" stroke-width="1.5"/>
  <rect x="10" y="22" width="16" height="2" fill="#065f46"/>
  <rect x="10" y="46" width="16" height="2" fill="#065f46"/>
  <!-- Middle book (yellow) -->
  <rect x="26" y="14" width="14" height="38" rx="2" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
  <rect x="26" y="18" width="14" height="2" fill="#78350f"/>
  <rect x="26" y="46" width="14" height="2" fill="#78350f"/>
  <!-- Front book (pink) tilted -->
  <g transform="rotate(8 48 35)">
    <rect x="40" y="16" width="14" height="38" rx="2" fill="#f472b6" stroke="#831843" stroke-width="1.5"/>
    <rect x="40" y="20" width="14" height="2" fill="#831843"/>
    <rect x="40" y="48" width="14" height="2" fill="#831843"/>
  </g>
  <!-- Star sparkle -->
  <g transform="translate(46 10)">
    <path d="M4 0 L5.2 2.8 L8 4 L5.2 5.2 L4 8 L2.8 5.2 L0 4 L2.8 2.8 Z" fill="#fde68a"/>
  </g>
</svg>
