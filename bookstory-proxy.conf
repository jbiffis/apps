# BookStory PWA: serve static files, fallback to index.html for client routes
<Directory "/var/www/html/bookstory">
    FallbackResource /bookstory/index.html
</Directory>

# Long cache for hashed build assets
<LocationMatch "^/bookstory/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Service worker must not be cached by proxies/browsers (lives at scope root)
<LocationMatch "^/bookstory/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$">
    Header set Cache-Control "no-cache"
</LocationMatch>
