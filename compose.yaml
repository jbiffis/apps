services:
  web:
    build: .
    ports:
      - "8081:80"
    volumes:
      - ./beer:/var/www/html/beer
      - /var/lib/docker/volumes/apps/beer:/var/www/data/beer
      - ./simgolf/frontend/dist:/var/www/html/simgolf
      - ./book-log/dist:/var/www/html/book-log
      - ./webapp-proxy.conf:/etc/apache2/conf-enabled/webapp-proxy.conf:ro
      - ./book-log-proxy.conf:/etc/apache2/conf-enabled/book-log-proxy.conf:ro
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    depends_on:
      - simgolf-php
    networks:
      - default
      - data-tracking-globe
    restart: unless-stopped

  simgolf-php:
    build:
      context: ./simgolf/api
      dockerfile: Dockerfile
    volumes:
      - ./simgolf/api:/var/www/api
    env_file: ./.env
    restart: unless-stopped

networks:
  data-tracking-globe:
    external: true
