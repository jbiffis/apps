services:
  web:
    build: .
    ports:
      - "8081:80"
    volumes:
      # User data volumes — must remain bind mounts (runtime-written, not in git)
      - /var/lib/docker/volumes/apps/beer:/var/www/data/beer
      - /var/lib/docker/volumes/apps/dreamworld:/var/www/data/dreamworld
      - /var/lib/docker/volumes/apps/golf:/var/www/data/golf
      # Apache proxy confs — bind-mounted so conf changes don't need an image rebuild.
      # These are small text files that are reliably present in the Komodo repo clone.
      - ./webapp-proxy.conf:/etc/apache2/conf-enabled/webapp-proxy.conf:ro
      - ./bookstory-proxy.conf:/etc/apache2/conf-enabled/bookstory-proxy.conf:ro
      - ./dreamworld-proxy.conf:/etc/apache2/conf-enabled/dreamworld-proxy.conf:ro
      - ./tracker-proxy.conf:/etc/apache2/conf-enabled/tracker-proxy.conf:ro
      # All app source and frontend dists are now baked into the image (see Dockerfile).
      # Removed: ./beer, ./simgolf/frontend/dist, ./book-log/dist, ./dreamworld/dist,
      #          ./dreamworld/api, ./tracker/frontend/dist
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    depends_on:
      - simgolf-php
    networks:
      - default
      - data-tracking-globe
      - tracker-net
    restart: unless-stopped

  simgolf-php:
    build:
      context: ./simgolf/api
      dockerfile: Dockerfile
    volumes:
      - ./simgolf/api:/var/www/api
    env_file: ./.env
    restart: unless-stopped

  # The tracker app (tracker-backend + tracker-db) lives in its OWN Komodo
  # stack — tracker/compose.yaml — so its secrets stay out of this stack's
  # env and out of `docker inspect` for anyone (e.g. the agent API user) who
  # has access to biffis-apps but not to the tracker stack. `web` above only
  # reverse-proxies /tracker/api/* to tracker-backend over the shared external
  # `tracker-net`; it holds no tracker secret. Deploy the tracker stack first
  # (it creates tracker-net), then this one.

networks:
  data-tracking-globe:
    external: true
  tracker-net:
    external: true
    name: tracker-net
