services:
  web:
    build: .
    ports:
      - "8081:80"
    volumes:
      - ./beer:/var/www/html/beer
      - /var/lib/docker/volumes/apps/beer:/var/www/data/beer
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    depends_on:
      - simgolf-nginx

  simgolf-nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./simgolf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./simgolf/frontend/dist:/var/www/html:ro
      - ./simgolf/api:/var/www/api:ro
    depends_on:
      - simgolf-php
    restart: unless-stopped

  simgolf-php:
    build:
      context: ./simgolf/api
      dockerfile: Dockerfile
    volumes:
      - ./simgolf/api:/var/www/api
    env_file: ./simgolf/.env
    restart: unless-stopped
