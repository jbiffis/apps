# Dreamworld PWA: serve static files, fallback to index.html for client routes.
# A nested mount puts PHP API files at /var/www/html/dreamworld/api so they
# resolve as files before Apache's FallbackResource is consulted.
<Directory "/var/www/html/dreamworld">
    FallbackResource /dreamworld/index.html
</Directory>

# Disable the SPA fallback inside the API directory so unknown routes 404
# instead of returning the React shell.
<Directory "/var/www/html/dreamworld/api">
    FallbackResource disabled
    Options -Indexes
</Directory>

# Long cache for hashed build assets
<LocationMatch "^/dreamworld/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Service worker / manifest must not be cached at the scope root
<LocationMatch "^/dreamworld/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$">
    Header set Cache-Control "no-cache"
</LocationMatch>

# API responses are dynamic — never cache.
<LocationMatch "^/dreamworld/api/">
    Header set Cache-Control "no-store"
</LocationMatch>

# Pass the admin password header through to PHP (some builds strip it
# because of the underscore conversion). $_SERVER['HTTP_X_ADMIN_PASSWORD']
# works by default but this is belt-and-braces.
SetEnvIfNoCase X-Admin-Password "(.*)" HTTP_X_ADMIN_PASSWORD=$1
