# Simgolf API → PHP-FPM
<LocationMatch "^/simgolf/api">
    SetHandler "proxy:fcgi://simgolf-php:9000/var/www/api/public/index.php"
</LocationMatch>

# Simgolf SPA: serve static files, fallback to index.html for client routes
<Directory "/var/www/html/simgolf">
    FallbackResource /simgolf/index.html
</Directory>
