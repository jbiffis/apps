# Send every API route to the front controller at its path inside PHP-FPM.
# Map the script explicitly instead of deriving PATH_INFO from Apache's local path.
ProxyPassMatch "^/simgolf/api(?:/.*)?$" "fcgi://simgolf-php:9000/var/www/api/public/index.php"

# Simgolf SPA: serve static files, fallback to index.html for client routes
<Directory "/var/www/html/simgolf">
    FallbackResource /simgolf/index.html
</Directory>
