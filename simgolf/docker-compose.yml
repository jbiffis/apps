services:
  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html:ro
      - ./api:/var/www/api:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/var/www/api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: simgolf
      DB_USER: simgolf
      DB_PASS: simgolf
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simgolf
      POSTGRES_USER: simgolf
      POSTGRES_PASSWORD: simgolf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simgolf -d simgolf"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
