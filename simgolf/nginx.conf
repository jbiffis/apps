server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Production path: /simgolf/api/* → PHP (strip /simgolf prefix)
    location ~ ^/simgolf/api(/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param REQUEST_URI /api$1$is_args$args;
        fastcgi_pass php:9000;
    }

    # Production path: /simgolf/* → frontend (alias strips the prefix)
    location /simgolf/ {
        alias /var/www/html/;
        try_files $uri /simgolf/index.html;
    }

    # Local direct access: /api/* → PHP
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass php:9000;
    }

    # Local direct access: /* → frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
