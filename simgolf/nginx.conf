server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Production: served via reverse proxy at /simgolf/
    location /simgolf/api/ {
        rewrite ^/simgolf(/api/.*)$ $1 break;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param REQUEST_URI $uri;
    }

    location /simgolf/ {
        rewrite ^/simgolf/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Local direct access (port 8082)
    location /api/ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets
    location ~* \.(js|css|png|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
