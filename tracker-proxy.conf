# Tracker app: serve the SPA statically + reverse-proxy the API, both through
# the shared Apache. The frontend is a Vite build bind-mounted at
# /var/www/html/tracker (see compose.yaml); the backend lives on the private
# tracker-net in its own Komodo stack.

<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

ProxyPreserveHost On
ProxyRequests Off

# Spring Boot backend on the private tracker-net. Declared before the static
# fallback so /tracker/api/* is proxied, never served as files.
<Location "/tracker/api/">
    ProxyPass        "http://tracker-backend:8080/api/"
    ProxyPassReverse "http://tracker-backend:8080/api/"
</Location>

# Dynamic API responses must never be cached by proxies/browsers.
<LocationMatch "^/tracker/api/">
    Header set Cache-Control "no-store"
</LocationMatch>

# SPA: serve static files, fall back to index.html for client-side routes.
<Directory "/var/www/html/tracker">
    FallbackResource /tracker/index.html
</Directory>

# Long cache for content-hashed build assets.
<LocationMatch "^/tracker/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Service worker / manifest must not be cached at the scope root.
<LocationMatch "^/tracker/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$">
    Header set Cache-Control "no-cache"
</LocationMatch>
