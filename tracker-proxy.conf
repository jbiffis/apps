# Tracker app: reverse-proxy SPA + API through the shared Apache.
# Frontend isn't built yet (Epic 5). Until then only the API location is active;
# /tracker/ will 502 cleanly.

<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

ProxyPreserveHost On
ProxyRequests Off

# Spring Boot backend on the private tracker-net.
<Location "/tracker/api/">
    ProxyPass        "http://tracker-backend:8080/api/"
    ProxyPassReverse "http://tracker-backend:8080/api/"
</Location>

# Dynamic API responses must never be cached by proxies/browsers.
<LocationMatch "^/tracker/api/">
    Header set Cache-Control "no-store"
</LocationMatch>

