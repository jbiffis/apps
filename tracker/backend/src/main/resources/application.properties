spring.application.name=tracker
server.port=${APP_PORT:8080}

# --- Database (env-driven; no defaults that would mask config errors) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:tracker-db}:${DB_PORT:5432}/${DB_NAME:tracker}
spring.datasource.username=${DB_USERNAME:tracker}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema. Hibernate verifies but never modifies it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- App config ---
tracker.jwt.secret=${JWT_SECRET}
tracker.jwt.ttl-days=30
tracker.uploads.dir=${UPLOAD_DIR:/uploads}
tracker.admin.password=${ADMIN_PASSWORD:}

# --- Logging ---
# Quiet by default; never log request bodies or user-supplied content.
logging.level.root=INFO
logging.level.com.biffis.tracker=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Disable Spring Boot defaults that could leak data
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
