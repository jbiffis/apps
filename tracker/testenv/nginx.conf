server {
    listen 80;
    server_name _;

    # API → backend (must come before the SPA location so it isn't shadowed).
    location /tracker/api/ {
        proxy_pass http://tracker-test-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: serve the Vite build, fall back to index.html for client routes.
    location /tracker/ {
        alias /usr/share/nginx/html/tracker/;
        try_files $uri $uri/ /tracker/index.html;
    }

    location = / {
        return 302 /tracker/;
    }
}
