# Reverse-proxy data-tracking SPAs and PostgREST through Apache.
# Target is the webapp compose stack's `frontend` service (nginx) on the
# data-tracking-globe network.

# Load proxy_http only if not already enabled via a2enmod.
# Lets this config work without an image rebuild (Komodo does restart-only).
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

ProxyPreserveHost On
ProxyRequests Off

<Location "/weather">
    ProxyPass        "http://frontend:80/weather"
    ProxyPassReverse "http://frontend:80/weather"
</Location>

<Location "/stocks">
    ProxyPass        "http://frontend:80/stocks"
    ProxyPassReverse "http://frontend:80/stocks"
</Location>

<Location "/water-levels">
    ProxyPass        "http://frontend:80/water-levels"
    ProxyPassReverse "http://frontend:80/water-levels"
</Location>

<Location "/api">
    ProxyPass        "http://frontend:80/api"
    ProxyPassReverse "http://frontend:80/api"
</Location>
